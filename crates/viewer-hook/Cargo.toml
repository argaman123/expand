[package]
name = "expand_viewer_hook"
version = "0.1.0"
edition = "2021"
description = "A small library Windows loads into the viewer (Moonlight) to keep its stream window out of sight from the moment it is made"

[lib]
# The library Windows loads into the viewer, and the same code for the tests.
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
