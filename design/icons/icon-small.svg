<!-- The app icon for 16 to 40 px (the PC's tray, title bars, the .ico's small sizes): the same
     split tile, full bleed, with a faint light rim in place of the glow and shadows, a bigger
     pointer and a thicker outline. On a 32 grid, so the edges land on whole pixels at 16 and 32 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3b45"/><stop offset="1" stop-color="#1e1f25"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fcbff"/><stop offset=".5" stop-color="#5d8bff"/><stop offset="1" stop-color="#6f3ae8"/></linearGradient>
    <clipPath id="sq"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="16" height="32" fill="url(#left)"/>
    <rect x="16" width="16" height="32" fill="url(#right)"/>
    <!-- A faint light rim, one pixel wide at 16 px, so the dark half still has an edge on a dark
         taskbar. -->
    <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="2"/>
  </g>
  <path d="M9 4 L9 24.5 L14 19.5 L17.5 27.5 L21.5 25.75 L18 18 L25 18 Z" fill="#fff" stroke="#111217" stroke-width="2" stroke-linejoin="round"/>
</svg>
