[package]
name = "sidescreen-app"
version = "0.1.0"
description = "Use a PC monitor as an extra display for a Mac"
edition = "2021"

[lib]
name = "sidescreen_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sidescreen_core = { path = "../../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"
